<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crystal, Unclear</title>
  <link rel="stylesheet" href="mystyle.css">
  <link rel="icon" type="image/x-icon" href="Resources/favicon.png">
</head>
<body>
  <!-- Background container -->
  <div class="background">
  </div>

  <!-- Main content -->
  <div class="outer-container">
    <h1 class="title">Crystal, Unclear</h1>

    <div class="simple-plaque">
      Because of previous... events<br>
      only yes-or-no questions will be accepted
    </div>

    <form class="form" id="crystalnotclear">
      <!-- Name input -->
      <div class="input-group">
        <label class="input-label" for="userName">How may I call you?</label>
        <input 
          class="input-field input-name"
          type="text" 
          id="userName" 
          name="userName" 
          placeholder="Tell me your name... or not">
      </div>

      <!-- Question input -->
      <div class="input-group">
        <label class="input-label" for="userQuestion">What is troubling you?</label>
        <input 
          class="input-field input-question"
          type="text" 
          id="userQuestion" 
          name="userQuestion" 
          placeholder="Share your enigma!" 
          title="Tell me your deepest fears...">
      </div>

      <!-- Submit button -->
      <button class="question-button" type="submit" id="submit">
        Ask the Future Facilitator
      </button>
    </form>

    <!-- Results -->
    <div class="fade-in-text results">
      <div class="result-line result-line-1" id="result1"></div>
      <div class="result-line result-line-2" id="result2"></div>
    </div>

    <div class="typewriter result-main" id="result3"></div>
  </div>

  <script src="magic8Ball.js"></script>
</body>
</html>
